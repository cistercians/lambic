<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste Test</title>
</head>
<body>
    <h1>Log Paste Test</h1>
    <textarea id="test-textarea" rows="10" cols="80" placeholder="Paste your logs here..."></textarea>
    <br><br>
    <button onclick="testParse()">Test Parse</button>
    <div id="results"></div>

    <script>
        // Simple test of the parsing logic
        function testParse() {
            const textarea = document.getElementById('test-textarea');
            const results = document.getElementById('results');

            const text = textarea.value.trim();
            if (!text) {
                results.innerHTML = '<p style="color: red;">Please enter some text to test.</p>';
                return;
            }

            // Simple parsing test
            const lines = text.split('\n');
            let parsedCount = 0;
            const entries = [];

            for (const line of lines) {
                if (line.trim()) {
                    // Test the regex from our parser
                    const timestampMatch = line.match(/\[(\d{1,2}:\d{1,2}:\d{1,2})\]/);
                    const levelMatch = line.match(/\[([A-Z][A-Z]*)\]/);
                    const categoryMatch = line.match(/\[([A-Za-z][A-Za-z]*)\]/);

                    if (timestampMatch && levelMatch && categoryMatch) {
                        parsedCount++;
                        entries.push({
                            line: line.substring(0, 50) + (line.length > 50 ? '...' : ''),
                            timestamp: timestampMatch[1],
                            level: levelMatch[1].toLowerCase(),
                            category: categoryMatch[1].toLowerCase()
                        });
                    }
                }
            }

            results.innerHTML = `
                <h3>Test Results:</h3>
                <p>Input lines: ${lines.length}</p>
                <p>Successfully parsed: ${parsedCount}</p>
                <p>Sample entries:</p>
                <ul>
                    ${entries.slice(0, 5).map(entry =>
                        `<li>${entry.line} → ${entry.level}/${entry.category}</li>`
                    ).join('')}
                </ul>
            `;
        }
    </script>
</body>
</html>
